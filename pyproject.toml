[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-review-agent"
version = "0.1.0"
description = "Multi-agent pull request reviewer built on LangGraph"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    {name = "Sukhrob Nurali", email = "sukhrobnuralievv@gmail.com"},
]
keywords = ["pr-review", "code-review", "langgraph", "langchain", "github-action", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "langgraph~=0.2.40",
    "langchain-core~=0.3.20",
    "langchain-openai~=0.2.10",
    "langchain-anthropic~=0.3.0",
    "openai~=1.55.0",
    "anthropic~=0.40.0",
    "githubkit~=0.11.10",
    "httpx~=0.27.2",
    "pydantic~=2.10.0",
    "pydantic-settings~=2.6.0",
    "pyyaml~=6.0.2",
    "structlog~=24.4.0",
    "typer~=0.13.0",
    "jinja2~=3.1.4",
]

[project.optional-dependencies]
dev = [
    "ruff~=0.7.4",
    "mypy~=1.13.0",
    "pytest~=8.3.3",
    "pytest-asyncio~=0.24.0",
    "pytest-cov~=6.0.0",
    "vcrpy~=6.0.1",
    "types-PyYAML~=6.0.12",
]

[project.scripts]
pr-review-agent = "pr_review_agent.cli:app"

[project.urls]
Homepage = "https://github.com/sukhrobnurali/pr-review-agent"
Issues = "https://github.com/sukhrobnurali/pr-review-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_review_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N806"]
"src/pr_review_agent/cli.py" = ["B008", "UP007"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/pr_review_agent"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "eval: benchmark tests, deselect with '-m \"not eval\"'",
    "integration: integration tests requiring fixtures or cassettes",
]

[tool.coverage.run]
source = ["src/pr_review_agent"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
