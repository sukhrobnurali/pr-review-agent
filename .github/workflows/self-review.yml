name: self-review

# The agent reviewing its own PRs. Posts (or updates) one comment per PR.
# Skipped on forks because the secret isn't available.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync
        run: uv sync --extra dev

      - name: Review this PR
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REF: ${{ github.repository }}#${{ github.event.pull_request.number }}
        run: |
          uv run pr-review-agent review "$PR_REF" \
            --config .pr-review.yml \
            --cache-dir "${RUNNER_TEMP}/pr-cache"
